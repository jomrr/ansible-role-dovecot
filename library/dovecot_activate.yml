---
# role: dovecot
# file: library/dovecot_activate.yml

DOCUMENTATION:
  module: dovecot_activate
  short_description: Reconcile the running Dovecot master with its validated inputs
  description:
    - Compares the master configuration with the last successful service activation.
    - Acknowledges a validated revision after its service action succeeds under a host-local lock.
  options:
    operation:
      description: Capture the prior lookup drivers, inspect pending configuration or apply the validated revision.
      type: str
      choices: [baseline, plan, apply]
      required: true
    expected_revision:
      description: Exact revision previously inspected, required for apply.
      type: str
    service_manager:
      description: Host service manager, required for apply.
      type: str
    lookup_drivers:
      description: Selected SQL and LDAP drivers, required for apply. Adding a driver restarts a running master.
      type: list
      elements: str
      choices: [mysql, pgsql, ldap]
    predict_config_change:
      description: Master configuration changes predicted by file tasks in check mode.
      type: bool
      default: false
  author: Jonas Mauer
EXAMPLES: |-
  - name: Inspect the installed revision
    dovecot_activate:
      operation: plan
RETURN:
  pending:
    description: Whether the configuration requires activation.
    type: bool
    returned: plan or apply
  revision:
    description: Configuration revision to present for activation.
    type: str
    returned: plan or apply
