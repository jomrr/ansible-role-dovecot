---
# role: dovecot
# file: vars/AlmaLinux.yml

__dovecot_repository_file: repository_almalinux.yml
__dovecot_repository_packages: [epel-release]
__dovecot_enablerepo: [crb]
__dovecot_packages:
  - 'dovecot >= 2:2.4'
  - dovecot-lmtpd
__dovecot_imap_packages:
  - dovecot-imapd
__dovecot_sieve_packages:
  - dovecot-sieve
  - dovecot-managesieved
__dovecot_gssapi_packages: ['dovecot-gssapi']
__dovecot_ldap_packages: ['dovecot-ldap']
