---
# role: dovecot
# file: vars/Debian.yml

__dovecot_package_database: dpkg
# Suppress automatic daemon startup until the configuration has been validated.
__dovecot_policy_rc_d: 101
__dovecot_packages:
  - dovecot-core
  - dovecot-lmtpd
__dovecot_imap_packages:
  - dovecot-imapd
__dovecot_sieve_packages:
  - dovecot-sieve
  - dovecot-managesieved
__dovecot_validate_config: /usr/bin/doveconf -c %s -n
__dovecot_nologin: /usr/sbin/nologin
__dovecot_gssapi_packages: ['dovecot-gssapi']
__dovecot_ldap_packages: ['dovecot-ldap']
__dovecot_sql_packages:
  mysql: ['dovecot-mysql']
  pgsql: ['dovecot-pgsql']
__dovecot_selinux_packages: [policycoreutils-python-utils, python3-selinux]
