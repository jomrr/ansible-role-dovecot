---
# role: dovecot
# file: tasks/lookups.yml

- name: DOVECOT | Configure the SQL lookup connection
  become: true
  become_user: root
  ansible.builtin.template:
    src: "sql.conf.ext.j2"
    dest: /etc/dovecot/sql.conf.ext
    owner: root
    group: dovecot
    mode: '0640'
  when: dovecot_sql_enabled
  no_log: true
  notify: reload dovecot

- name: DOVECOT | Configure the directory lookup connection
  become: true
  become_user: root
  ansible.builtin.template:
    src: "ldap.conf.ext.j2"
    dest: /etc/dovecot/ldap.conf.ext
    owner: root
    group: dovecot
    mode: '0640'
  when: dovecot_ldap_enabled
  no_log: true
  notify: reload dovecot
