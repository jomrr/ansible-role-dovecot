---
# role: dovecot
# file: tasks/sieve-script.yml

- name: DOVECOT | Validate and install the administrator Sieve source
  become: true
  become_user: root
  ansible.builtin.template:
    src: sieve-script.j2
    dest: "{{ __dovecot_script_path }}.sieve"
    owner: root
    group: "{{ __dovecot_script_group }}"
    mode: '0640'
    validate: /usr/bin/sievec -c /etc/dovecot/dovecot.conf %s
  register: __dovecot_sieve_source
  when: __dovecot_script.value | length > 0

- name: DOVECOT | Compile the administrator script for the current configuration
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [/usr/bin/sievec, -c, /etc/dovecot/dovecot.conf, "{{ __dovecot_script_path }}.sieve"]
    creates: "{{ omit if __dovecot_sieve_source.changed or __dovecot_config_file.changed else __dovecot_script_path ~ '.svbin' }}"
  register: __dovecot_compilation
  when: __dovecot_script.value | length > 0

- name: DOVECOT | Protect the compiled Sieve binary
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __dovecot_script_path }}.svbin"
    owner: root
    group: "{{ __dovecot_script_group }}"
    mode: '0640'
  when:
    - __dovecot_script.value | length > 0
    - not ansible_check_mode or not (__dovecot_compilation.changed or __dovecot_compilation is skipped)

- name: DOVECOT | Remove the inactive script and compiled binary
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __dovecot_script_path }}.{{ __dovecot_suffix }}"
    state: absent
  loop: [sieve, svbin]
  loop_control:
    loop_var: __dovecot_suffix
  when: __dovecot_script.value | length == 0
