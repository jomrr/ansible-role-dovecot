---
# role: dovecot
# file: tasks/accounts.yml

# Winbind takes a SID for group names containing spaces. Types 2, 4 and 5 are groups or aliases.
- name: accounts | Resolve the AD mailbox group SID for the Dovecot PAM service
  ansible.builtin.command:
    argv: [wbinfo, --name-to-sid, "{{ dovecot_pam_group }}"]
  register: __dovecot_pam_group_lookup
  changed_when: false
  failed_when: __dovecot_pam_group_lookup.rc != 0 or __dovecot_pam_group_lookup.stdout is not search(' [(][245][)]$')
  check_mode: false
  when: dovecot_pam_enabled and dovecot_pam_backend == 'winbind'

- name: accounts | Install the Dovecot PAM service
  become: true
  become_user: root
  ansible.builtin.template:
    src: pam.j2
    dest: "/etc/pam.d/{{ dovecot_pam_service }}"
    owner: root
    group: root
    mode: '0644'
    backup: "{{ dovecot_backup }}"
  when: dovecot_pam_enabled

- name: accounts | Reserve local password identities before external authentication
  become: true
  become_user: root
  ansible.builtin.template:
    src: local-password-names.j2
    backup: false
    dest: /etc/dovecot/local-password-names
    owner: root
    group: dovecot
    mode: '0640'
  diff: false

- name: accounts | Write the private account database
  become: true
  become_user: root
  ansible.builtin.template:
    src: users.j2
    backup: false
    dest: /etc/dovecot/users
    owner: root
    group: dovecot
    mode: '0640'
  diff: false
  no_log: true

- name: accounts | Write the private SMTP authentication database
  become: true
  become_user: root
  ansible.builtin.template:
    src: sasl-users.j2
    backup: false
    dest: /etc/dovecot/sasl-users
    owner: root
    group: dovecot
    mode: '0640'
  diff: false
  no_log: true
