---
# role: dovecot
# file: tasks/accounts.yml

- name: DOVECOT | Reserve local password identities before external authentication
  become: true
  become_user: root
  ansible.builtin.template:
    src: local-password-names.j2
    dest: /etc/dovecot/local-password-names
    owner: root
    group: dovecot
    mode: '0640'

- name: DOVECOT | Write the private account database
  become: true
  become_user: root
  ansible.builtin.template:
    src: "users.j2"
    dest: /etc/dovecot/users
    owner: root
    group: dovecot
    mode: '0640'
  no_log: true

- name: DOVECOT | Write the private SMTP authentication database
  become: true
  become_user: root
  ansible.builtin.template:
    src: sasl-users.j2
    dest: /etc/dovecot/sasl-users
    owner: root
    group: dovecot
    mode: '0640'
  no_log: true
