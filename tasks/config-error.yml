---
# role: dovecot
# file: tasks/config-error.yml

- name: DOVECOT | Preserve the configuration diagnostic for the administrator
  become: true
  become_user: root
  ansible.builtin.copy:
    dest: /var/log/dovecot-config-error.log
    content: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg, true) }}\n"
    owner: root
    group: root
    mode: '0600'
  diff: false
  no_log: true
  when: not ansible_check_mode

- name: DOVECOT | Report the validation error without configuration values
  ansible.builtin.fail:
    msg: >-
      Dovecot configuration failed.
      {{ ansible_failed_result.stderr | default('') | regex_findall(__dovecot_error_pattern) | map('join', ' ') | join(' ') | trim }}
      {{ 'Read /var/log/dovecot-config-error.log on the managed host for the full diagnostic.' if not ansible_check_mode else '' }}
  vars:
    # Native errors can quote an entire rejected value. Expose only the line, setting name and error category.
    __dovecot_error_pattern: >-
      (?m)^doveconf: (?:Fatal|Error): Error in configuration file [^\r\n]+? (line [0-9]+):
      ((?:[a-zA-Z_][a-zA-Z0-9_]*: )?(?:Unknown (?:setting|section name): [a-zA-Z_][a-zA-Z0-9_]*|Invalid (?:port number|number|value|size|time interval)))?
