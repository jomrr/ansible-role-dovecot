---
# role: dovecot
# file: tasks/sieve_script.yml

- name: sieve_script | Create the private binary cache for this script storage
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __dovecot_script_binary | dirname }}"
    state: directory
    owner: root
    group: "{{ __dovecot_script_group }}"
    mode: '0750'
    setype: _default

- name: sieve_script | Validate and install the administrator Sieve source
  become: true
  become_user: root
  ansible.builtin.template:
    src: sieve-script.j2
    dest: "{{ __dovecot_script_source }}"
    owner: root
    group: "{{ __dovecot_script_group }}"
    mode: '0640'
    backup: "{{ dovecot_backup }}"
    validate: "{{ __dovecot_compiler | map('quote') | join(' ') }} %s"
  register: __dovecot_sieve_source

# sievec builds the binary executed by Pigeonhole against the pending Dovecot configuration.
- name: sieve_script | Compile the administrator script for the current configuration
  become: true
  become_user: root
  ansible.builtin.command:
    argv: "{{ __dovecot_compiler + [__dovecot_script_source, __dovecot_script_binary] }}"
    creates: "{{ omit if __dovecot_sieve_source.changed or __dovecot_activation.pending else __dovecot_script_binary }}"
  register: __dovecot_compilation
  changed_when: __dovecot_compilation.changed and __dovecot_compilation.rc == 0
  failed_when: __dovecot_compilation.rc != 0

- name: sieve_script | Protect the compiled Sieve binary
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __dovecot_script_binary }}"
    owner: root
    group: "{{ __dovecot_script_group }}"
    mode: '0640'
    setype: _default
  when: not ansible_check_mode or not (__dovecot_compilation.changed or __dovecot_compilation is skipped)
