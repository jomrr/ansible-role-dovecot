---
# role: dovecot
# file: tasks/sieve.yml

- name: DOVECOT | Reconcile each administrator Sieve script and its binary
  ansible.builtin.include_tasks: sieve-script.yml
  loop: "{{ __dovecot_sieve_scripts | dict2items }}"
  loop_control:
    loop_var: __dovecot_script
    label: "{{ __dovecot_script.key }}"
  vars:
    __dovecot_script_path: "/etc/dovecot/sieve-{{ __dovecot_script.key }}"
    __dovecot_script_group: "{{ 'dovecot-sieve' if dovecot_mail_ownership == 'per_user' else dovecot_mail_group }}"
