---
# role: dovecot
# file: tasks/repository_almalinux.yml

- name: repository_almalinux | Install the verified Dovecot CE repository key
  become: true
  become_user: root
  ansible.builtin.get_url:
    url: https://repo.dovecot.org/DOVECOT-REPO-GPG-2.4
    dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-dovecot-ce-2.4
    backup: "{{ dovecot_backup }}"
    checksum: sha256:26bb2ed4b7b746159e85ebd0f2817a92014af6c9d0fcdd917a8330e29eb6f11b
    mode: '0644'

- name: repository_almalinux | Trust the Dovecot CE package signing key
  become: true
  become_user: root
  ansible.builtin.rpm_key:
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-dovecot-ce-2.4
    fingerprint: EF0882079FD4ED32BF8B23B2A1B09EF84EDC5219

- name: repository_almalinux | Enable the signed Dovecot CE 2.4 RPM repository
  become: true
  become_user: root
  ansible.builtin.yum_repository:
    name: dovecot-ce-2.4
    description: Dovecot Community Edition 2.4
    baseurl: https://repo.dovecot.org/ce-2.4-latest/rhel/$releasever/RPMS/$basearch/
    gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-dovecot-ce-2.4
    gpgcheck: true
    repo_gpgcheck: true
    includepkgs: dovecot*
    enabled: true
    mode: '0644'
