---
# role: dovecot
# file: tasks/main.yml

- name: Load host facts and platform settings
  ansible.builtin.import_tasks: set_vars.yml

- name: Validate deployment inputs
  ansible.builtin.import_tasks: assert.yml

- name: Configure the vendor package repository when required
  ansible.builtin.include_tasks: "{{ __dovecot_repository_file }}"
  when: __dovecot_repository_file is defined

- name: Install Dovecot 2.4 packages
  ansible.builtin.import_tasks: install.yml

# Package versions include distribution epochs and revisions. The executable reports the upstream version.
- name: Require an installed Dovecot 2.4 executable
  ansible.builtin.command:
    argv: [/usr/sbin/dovecot, --version]
  register: __dovecot_version
  changed_when: false
  failed_when: __dovecot_version.rc != 0 or __dovecot_version.stdout is not match('^2[.]4[.]')
  check_mode: false

- name: Prepare mailbox storage
  ansible.builtin.import_tasks: storage.yml

- name: Manage file accounts
  ansible.builtin.import_tasks: accounts.yml

- name: Identify previously activated lookup drivers before replacing their configuration
  become: true
  become_user: root
  dovecot_activate:
    operation: baseline
  when: dovecot_sql_enabled or dovecot_ldap_enabled

- name: Configure delivery and client protocols
  ansible.builtin.import_tasks: config.yml

- name: Compile Sieve and activate the validated service
  ansible.builtin.import_tasks: activation.yml

- name: Provision homes from active mailbox lookups
  ansible.builtin.import_tasks: provision.yml
