---
# role: dovecot
# file: tasks/main.yml

- name: DOVECOT | Gather missing host facts required by the role
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', distribution, platform, pkg_mgr, selinux, service_mgr]
  when: "['distribution', 'os_family', 'fqdn', 'pkg_mgr', 'selinux', 'service_mgr'] | difference(ansible_facts.keys()) | length > 0"

- name: DOVECOT | Load platform settings
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __dovecot_platform_files) }}"
  vars:
    __dovecot_platform_files:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: DOVECOT | Validate deployment inputs
  ansible.builtin.import_tasks: assert.yml

- name: DOVECOT | Install Dovecot 2.4 packages
  ansible.builtin.import_tasks: install.yml

- name: DOVECOT | Prepare mailbox storage
  ansible.builtin.import_tasks: storage.yml

- name: DOVECOT | Manage file accounts
  ansible.builtin.import_tasks: accounts.yml

- name: DOVECOT | Manage external lookup connections
  ansible.builtin.import_tasks: lookups.yml

- name: DOVECOT | Configure delivery and client protocols
  ansible.builtin.import_tasks: config.yml

- name: DOVECOT | Compile Sieve and activate the validated service
  ansible.builtin.import_tasks: activation.yml

- name: DOVECOT | Provision homes from active mailbox lookups
  ansible.builtin.import_tasks: provision.yml
