---
# role: dovecot
# file: tasks/service.yml

- name: DOVECOT | Validate the complete configuration before activation
  become: true
  become_user: root
  ansible.builtin.command:
    cmd: "{{ __dovecot_validate_config | replace('%s', '/etc/dovecot/dovecot.conf') }}"
  changed_when: false
  no_log: true
  when: __dovecot_service_state != 'started'

- name: DOVECOT | Enable delivery and apply pending configuration or package changes
  become: true
  become_user: root
  ansible.builtin.service:
    name: dovecot
    enabled: true
    state: "{{ __dovecot_service_state }}"
