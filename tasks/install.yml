---
# role: dovecot
# file: tasks/install.yml

- name: install | Install package repository prerequisites
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __dovecot_repository_packages }}"
    state: present
  when: __dovecot_repository_packages is defined

- name: install | Install delivery and selected protocol packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: >-
      {{ __dovecot_packages
         + (dovecot_imap_enabled | ternary(__dovecot_imap_packages, []))
         + (dovecot_sieve_enabled | ternary(__dovecot_sieve_packages, []))
         + (dovecot_gssapi_enabled | ternary(__dovecot_gssapi_packages, []))
         + (dovecot_sql_enabled | ternary(__dovecot_sql_packages[dovecot_sql.driver], []))
         + (dovecot_ldap_enabled | ternary(__dovecot_ldap_packages, []))
         + (__dovecot_selinux_enabled | ternary(__dovecot_selinux_packages, [])) }}
    enablerepo: "{{ __dovecot_enablerepo | default(omit) }}"
    state: present
    # Prevent package scripts from starting an unconfigured daemon.
    policy_rc_d: "{{ __dovecot_policy_rc_d | default(omit) }}"
