---
# role: dovecot
# file: tasks/storage.yml

- name: storage | Create the mailbox group
  become: true
  become_user: root
  ansible.builtin.group:
    name: "{{ dovecot_mail_group }}"
    gid: "{{ dovecot_mail_gid }}"
    system: true
  when: dovecot_mail_ownership == 'shared'

- name: storage | Create the mailbox storage account
  become: true
  become_user: root
  ansible.builtin.user:
    name: "{{ dovecot_mail_user }}"
    uid: "{{ dovecot_mail_uid }}"
    group: "{{ dovecot_mail_group }}"
    home: "{{ dovecot_mail_root }}"
    create_home: false
    shell: "{{ __dovecot_nologin }}"
    password_lock: true
    system: true
  when: dovecot_mail_ownership == 'shared'

# Set 0711 in mkdir itself, including for missing ancestors under a permissive umask or default ACL.
- name: storage | Create missing directories in the per-user mail-root path
  become: true
  become_user: root
  ansible.builtin.script:
    cmd: "dovecot_provision_homes.py --prepare-root {{ dovecot_mail_root | quote }}"
    executable: /usr/bin/python3
    creates: "{{ dovecot_mail_root }}"
  when: dovecot_mail_ownership == 'per_user'

- name: storage | Set mailbox root ownership and permissions
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ dovecot_mail_root }}"
    state: directory
    owner: "{{ 'root' if dovecot_mail_ownership == 'per_user' else dovecot_mail_user }}"
    group: "{{ 'root' if dovecot_mail_ownership == 'per_user' else dovecot_mail_group }}"
    mode: "{{ '0711' if dovecot_mail_ownership == 'per_user' else '0700' }}"

- name: storage | Configure the mailbox SELinux context
  ansible.builtin.import_tasks: selinux.yml
  when: __dovecot_selinux_enabled

- name: storage | Create private mailbox homes
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ dovecot_mail_root }}/{{ __dovecot_mailbox.name }}"
    state: directory
    owner: "{{ __dovecot_mailbox.uid | default(dovecot_mail_uid) | string }}"
    group: "{{ __dovecot_mailbox.gid | default(dovecot_mail_gid) | string }}"
    mode: '0700'
    follow: false
  loop: "{{ __dovecot_mailbox_metadata }}"
  loop_control:
    loop_var: __dovecot_mailbox
    label: "{{ __dovecot_mailbox.name }}"
  when: not __dovecot_provision
