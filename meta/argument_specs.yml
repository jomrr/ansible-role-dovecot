---
# role: dovecot
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install and configure Dovecot for secure LMTP delivery, virtual
      mailboxes and Sieve filtering.
    options:
      dovecot_hostname:
        type: str
        description: Hostname used in delivery greetings and generated messages.
        default: '{{ ansible_facts.fqdn }}'
      dovecot_postmaster_address:
        type: str
        description: Address receiving delivery error reports; required.
        required: true
      dovecot_mail_format:
        type: str
        description: Default mailbox format, with optional per-user overrides.
        choices:
          - maildir
          - mbox
          - sdbox
          - mdbox
        default: maildir
      dovecot_mail_root:
        type: str
        description: Parent directory for virtual mailbox homes.
        default: /var/vmail
      dovecot_mail_ownership:
        type: str
        description: Mailbox ownership policy for delivery and client processes.
        choices:
          - per_user
          - shared
        default: per_user
      dovecot_first_valid_uid:
        type: int
        default: 70000
        description: Inclusive lower bound for per-user mailbox UIDs.
      dovecot_last_valid_uid:
        type: int
        default: 99999
        description: Inclusive upper bound for per-user mailbox UIDs.
      dovecot_first_valid_gid:
        type: int
        default: 70000
        description: Inclusive lower bound for per-user mailbox GIDs.
      dovecot_last_valid_gid:
        type: int
        default: 99999
        description: Inclusive upper bound for per-user mailbox GIDs.
      dovecot_mail_user:
        type: str
        description: Unprivileged mailbox account in shared mode.
        default: vmail
      dovecot_mail_group:
        type: str
        description: Mailbox group in shared mode.
        default: vmail
      dovecot_mail_uid:
        type: int
        description: Numeric mailbox UID in shared mode.
        default: 5000
      dovecot_mail_gid:
        type: int
        description: Numeric mailbox GID in shared mode.
        default: 5000
      dovecot_users:
        type: list
        description: File-backed virtual accounts; removing an account preserves its stored
          mail.
        default: []
        elements: dict
        options:
          name:
            type: str
            required: true
            description: Unique lowercase mailbox address, also used as the login identity.
          password_hash:
            type: str
            required: true
            no_log: true
            description: Dovecot SHA512-CRYPT, BLF-CRYPT or ARGON2ID hash; * disables the
              file password.
          uid:
            type: int
            description: Stable unique mailbox UID, required in per_user mode.
          gid:
            type: int
            description: Mailbox primary GID, required in per_user mode.
          quota_storage_size:
            type: int
            description: Optional mailbox quota in bytes, including zero for unlimited storage.
          mail_format:
            type: str
            choices:
              - maildir
              - mbox
              - sdbox
              - mdbox
            description: Optional override of dovecot_mail_format; changing formats does
              not migrate mail.
      dovecot_lmtp_socket:
        type: str
        description: Local delivery socket accessible only to the configured MTA account.
        default: /var/spool/postfix/private/dovecot-lmtp
      dovecot_postfix_auth_enabled:
        type: bool
        description: Expose a private SASL authentication socket for Postfix.
        default: true
      dovecot_auth_socket:
        type: str
        description: Local SASL authentication socket inside the Postfix queue directory.
        default: /var/spool/postfix/private/auth
      dovecot_socket_user:
        type: str
        description: Existing MTA account allowed to access delivery and authentication
          sockets.
        default: postfix
      dovecot_socket_group:
        type: str
        description: Existing MTA group assigned to delivery and authentication sockets.
        default: postfix
      dovecot_imap_enabled:
        type: bool
        description: Enable IMAPS on dovecot_imaps_port.
        default: false
      dovecot_listen:
        type: list
        description: Bind addresses for explicitly enabled network services.
        default:
          - 127.0.0.1
        elements: str
      dovecot_tls_certificate:
        type: str
        description: Existing PEM certificate chain required for IMAPS or ManageSieve.
        default: ''
      dovecot_tls_private_key:
        type: str
        description: Existing root-readable PEM private key required for network services.
        default: ''
      dovecot_tls_min_protocol:
        type: str
        description: Minimum TLS version for client connections.
        choices:
          - TLSv1.2
          - TLSv1.3
        default: TLSv1.2
      dovecot_sieve_enabled:
        type: bool
        description: Enable Pigeonhole filtering during LMTP delivery.
        default: true
      dovecot_sieve_before:
        type: str
        description: Optional administrator Sieve script evaluated before personal scripts.
        default: ''
      dovecot_sieve_max_redirects:
        type: int
        description: Maximum redirect actions per message. A positive limit requires a Sieve
          mail transport.
        default: 0
      dovecot_managesieve_enabled:
        type: bool
        description: Enable ManageSieve on dovecot_managesieve_port with STARTTLS required
          for remote clients.
        default: false
      dovecot_backup:
        type: bool
        description: Back up the managed main configuration before replacement.
        default: false
      dovecot_sasl_users:
        type: list
        elements: dict
        default: []
        description: SMTP authentication accounts without mailbox records; names must be
          disjoint from mailbox identities.
        options:
          name:
            type: str
            required: true
            description: Unique lowercase full login address.
          password_hash:
            type: str
            required: true
            no_log: true
            description: Dovecot SHA512-CRYPT, BLF-CRYPT or ARGON2ID hash; disabled passwords
              are not accepted.
      dovecot_pam_enabled:
        type: bool
        default: false
        description: Enable additional password verification and account checks through
          an externally managed PAM service.
      dovecot_pam_service:
        type: str
        default: dovecot
        description: Existing PAM service name; the role does not configure PAM or join
          an AD domain.
      dovecot_pam_username_format:
        type: str
        choices:
          - full
          - localpart
        default: full
        description: Identity passed to PAM; the complete original login is restored after
          successful authentication.
      dovecot_pam_username_filter:
        type: list
        elements: str
        default: []
        description: Native Dovecot username patterns selecting PAM users; file password
          and submission-only accounts are excluded.
      dovecot_auth_worker_user:
        type: str
        default: ''
        description: Existing auth-worker account; empty preserves the native root default
          needed by pam_unix.
      dovecot_gssapi_enabled:
        type: bool
        default: false
        description: Enable Kerberos GSSAPI with an externally provisioned service keytab.
      dovecot_krb5_keytab:
        type: str
        default: /etc/dovecot/dovecot.keytab
        description: Existing dedicated keytab readable by the Dovecot auth process; creation
          and distribution are external.
      dovecot_gssapi_hostname:
        type: str
        default: '{{ dovecot_hostname }}'
        description: Exact hostname registered in the IMAP and SMTP service principals.
      dovecot_sql_enabled:
        type: bool
        default: false
        description: Enable independently configured SQL password and mailbox queries alongside
          file and LDAP sources.
      dovecot_sql:
        type: dict
        description: Local Unix socket or TLS-verified TCP connection with native Dovecot
          queries.
        options:
          driver:
            type: str
            required: true
            choices:
              - mysql
              - pgsql
            description: MySQL or MariaDB, or PostgreSQL driver.
          host:
            type: str
            required: true
            description: Database TLS hostname, absolute MySQL socket filename or PostgreSQL
              socket directory.
          port:
            type: int
            required: true
            description: Server port, also used to select a PostgreSQL socket.
          database:
            type: str
            required: true
            description: Existing database name.
          username:
            type: str
            required: true
            description: Read-only database account.
          password:
            type: str
            no_log: true
            description: Secret required for TCP or password-based socket authentication.
          ca_file:
            type: str
            description: Trusted CA file required for SQL over TCP.
          password_query:
            type: str
            required: true
            description: Native SQL returning user and password; empty disables SQL password
              authentication.
          user_query:
            type: str
            required: true
            description: Native SQL returning eligible mailbox records; empty disables SQL
              userdb.
          iterate_query:
            type: str
            required: true
            description: Native SQL returning eligible usernames for doveadm iteration;
              empty disables iteration.
        default:
          driver: mysql
          host: localhost
          port: 3306
          database: postfixadmin
          username: dovecot
          password: ''
          ca_file: ''
          password_query: ''
          user_query: ''
          iterate_query: ''
      dovecot_ldap_enabled:
        type: bool
        default: false
        description: Enable LDAP mailbox lookup without LDAP password authentication.
      dovecot_ldap:
        type: dict
        description: TLS-verified directory connection and mailbox selection; account and
          schema management remain external.
        options:
          uris:
            type: list
            elements: str
            required: true
            description: LDAPS endpoints; server names must match their certificates.
          bind_dn:
            type: str
            required: true
            description: Read-only directory bind identity.
          bind_password:
            type: str
            required: true
            no_log: true
            description: Directory bind password, supplied from a secret store.
          base:
            type: str
            required: true
            description: LDAP search base DN.
          ca_file:
            type: str
            required: true
            description: Existing trusted CA file used to verify LDAP server certificates.
          user_filter:
            type: str
            required: true
            description: Native LDAP filter selecting an enabled, mail-entitled account
              for the full login identity.
          user_fields:
            type: dict
            required: true
            description: Dovecot userdb fields mapped to native LDAP expressions, such as
              user to '%{ldap:mail}'.
          iterate_filter:
            type: str
            required: true
            description: LDAP filter enumerating eligible mailboxes for doveadm; empty disables
              iteration.
          iterate_user:
            type: str
            required: true
            description: Native LDAP expression returning each canonical mailbox identity
              during iteration.
        default:
          uris: []
          bind_dn: ''
          bind_password: ''
          base: ''
          ca_file: ''
          user_filter: ''
          user_fields: {}
          iterate_filter: ''
          iterate_user: '%{ldap:mail}'
      dovecot_home_provisioning:
        type: str
        description: Reconcile per-user LDAP and SQL mailbox homes on role runs, also on
          a timer, or externally.
        default: converge
        choices:
          - converge
          - timer
          - none
      dovecot_home_interval:
        type: int
        description: Seconds between optional systemd home provisioning runs.
        default: 300
      dovecot_selinux_type:
        type: str
        description: Persistent SELinux file type for the mailbox tree on SELinux-enabled
          hosts.
        default: mail_spool_t
      dovecot_lmtp_enabled:
        type: bool
        description: Enable LMTP delivery on the private MTA socket.
        default: true
      dovecot_submission_host:
        type: str
        description: SMTP endpoint (host or host:port) for messages generated during Sieve
          delivery.
        default: ''
      dovecot_sieve_sendmail_enabled:
        type: bool
        description: Allow local sendmail for Sieve when the SMTP endpoint is empty and
          the MTA authorizes the mailbox UIDs.
        default: false
      dovecot_imap_addresses:
        type: list
        description: IMAPS bind addresses, defaulting to dovecot_listen.
        default: []
        elements: str
      dovecot_imaps_port:
        type: int
        description: Implicit TLS IMAP port.
        default: 993
      dovecot_managesieve_addresses:
        type: list
        description: ManageSieve bind addresses, defaulting to dovecot_listen.
        default: []
        elements: str
      dovecot_managesieve_port:
        type: int
        description: ManageSieve port for STARTTLS clients.
        default: 4190
      dovecot_imap_max_userip_connections:
        type: int
        description: Optional IMAP connection limit per user and source IP address.
      dovecot_imap_idle_notify_interval:
        type: int
        description: Optional IMAP IDLE notification interval in seconds.
      dovecot_tls_cipher_list:
        type: str
        description: OpenSSL cipher list for TLS through 1.2, defaulting to the system policy.
        default: ''
      dovecot_tls_curve_list:
        type: str
        description: OpenSSL curve list, defaulting to the system policy.
        default: ''
      dovecot_tls_sni:
        type: list
        description: Additional certificates selected by TLS server name.
        default: []
        elements: dict
        options:
          name:
            type: str
            required: true
            description: DNS name for SNI.
          certificate:
            type: str
            required: true
            description: Absolute PEM certificate chain path.
          private_key:
            type: str
            required: true
            description: Absolute PEM private key path.
      dovecot_sieve_after:
        type: str
        description: Administrator Sieve source executed after the personal or default script.
        default: ''
      dovecot_sieve_default:
        type: str
        description: Administrator Sieve source used when a personal script is inactive.
        default: ''
      dovecot_sieve_extensions:
        type: list
        description: Personal Sieve extension allowlist. An empty list enables local filters
          and, with a transport, vacation and reject.
        default: []
        elements: str
      dovecot_sieve_max_script_size:
        type: int
        description: Maximum Sieve script size in bytes.
        default: 1048576
      dovecot_sieve_quota_script_count:
        type: int
        description: Maximum number of personal Sieve scripts.
        default: 20
      dovecot_sieve_quota_storage_size:
        type: int
        description: Maximum total personal Sieve storage in bytes.
        default: 5242880
      dovecot_lda_mailbox_autocreate:
        type: bool
        description: Allow delivery to create missing destination mailboxes.
        default: false
      dovecot_auth_cache_size:
        type: int
        description: Authentication cache size in bytes. Zero disables caching.
        default: 0
      dovecot_auth_cache_ttl:
        type: int
        description: Successful authentication cache lifetime in seconds when caching is
          enabled.
        default: 3600
      dovecot_auth_cache_negative_ttl:
        type: int
        description: Failed authentication cache lifetime in seconds when caching is enabled.
        default: 3600
      dovecot_recipient_delimiter:
        type: str
        description: Recipient address extension delimiter. An empty string disables extensions.
        default: +
      dovecot_quota_enabled:
        type: bool
        description: Enforce count-based storage quota and advertise IMAP QUOTA when IMAPS
          is enabled.
        default: false
      dovecot_quota_storage_size:
        type: int
        description: Default quota in bytes. Zero allows unlimited storage.
        default: 0
      dovecot_quota_grace:
        type: int
        description: Additional bytes allowed on the delivery that first crosses the limit.
        default: 0
      dovecot_quota_full_tempfail:
        type: bool
        description: Temporarily defer delivery when a mailbox is full.
        default: false
      dovecot_quota_status_enabled:
        type: bool
        description: Expose a private Postfix recipient quota policy socket.
        default: false
      dovecot_quota_status_socket:
        type: str
        description: Absolute path of the Postfix quota policy socket.
        default: /var/spool/postfix/private/quota-status
      dovecot_quota_warning_thresholds:
        type: list
        description: Storage percentages that invoke the warning program when crossed, highest
          first.
        default: []
        elements: int
      dovecot_quota_warning_program:
        type: str
        description: Absolute path to the administrator-provided quota warning executable.
        default: ''
      dovecot_quota_warning_user:
        type: str
        description: Unprivileged account running the quota warning program.
        default: nobody
      dovecot_mail_plugins:
        type: list
        description: Additional installed mail plugins inherited by each protocol.
        default: []
        elements: str
      dovecot_services:
        type: dict
        description: Native service settings keyed by service name, for example process_limit
          for imap-login.
        default: {}
      dovecot_config:
        type: str
        no_log: true
        description: Trusted native configuration appended to the managed main configuration.
        default: ''
