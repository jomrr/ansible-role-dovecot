---
# role: dovecot
# file: molecule/resources/playbooks/verify.yml

- name: DOVECOT | Enable a mixed batch of PostfixAdmin mailboxes
  hosts: dovecot_dc
  gather_facts: false
  tasks:
    - name: DOVECOT | Release a new mailbox alongside invalid identities and an unsafe home
      become: true
      become_user: root
      ansible.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        login_db: postfixadmin
        query: >-
          UPDATE mailbox SET active = TRUE
          WHERE username IN ('baduid@mail.test', 'badgid@mail.test', 'drift@mail.test', 'newhome@mail.test')

- name: DOVECOT | Verify delivery and secure client access
  hosts: dovecot_servers
  gather_facts: true
  tasks:

    - name: DOVECOT | Verify partial provisioning on one mail host
      when: inventory_hostname == ansible_play_hosts_all[0]
      block:
        - name: DOVECOT | Reconcile the mixed batch through the role
          ansible.builtin.include_role:
            name: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_PROJECT_DIRECTORY'') }}'
            tasks_from: provision

        - name: DOVECOT | Fail if skipped homes went unreported
          ansible.builtin.fail:
            msg: The role accepted the invalid mailbox records.

      rescue:
        - name: DOVECOT | Inspect the valid home created in the same pass
          ansible.builtin.stat:
            path: /var/vmail/newhome@mail.test
            get_checksum: false
            get_mime: false
          register: __dovecot_new_home

        - name: DOVECOT | Require private storage for the new user and a diagnostic for each skipped mailbox
          ansible.builtin.assert:
            that:
              - ansible_failed_result.rc | default(-1) == 65
              - ansible_failed_result.changed
              - "'baduid@mail.test' in ansible_failed_result.stderr"
              - "'badgid@mail.test' in ansible_failed_result.stderr"
              - "'drift@mail.test' in ansible_failed_result.stderr"
              - __dovecot_new_home.stat.uid == 70206
              - __dovecot_new_home.stat.mode == '0700'
            quiet: true

    - name: Verify the role rejects a new mail root below a user-owned directory
      when: inventory_hostname == ansible_play_hosts_all[0]
      block:
        - name: Check a nested mail root beneath a provisioned mailbox
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
            tasks_from: assert
            apply:
              check_mode: true
          vars:
            dovecot_mail_root: /var/vmail/maildir@example.test/missing/mail

        - name: Fail if the role accepted the user-owned ancestor
          ansible.builtin.fail:
            msg: The role accepted a mail root under a mailbox user's control.

      rescue:
        - name: Require the absolute path of the rejected directory
          ansible.builtin.assert:
            that:
              - ansible_failed_result.rc | default(-1) == 1
              - "'/var/vmail/maildir@example.test:' in (ansible_failed_result.stderr ~ ansible_failed_result.stdout)"
            quiet: true

    - name: DOVECOT | Exercise storage formats, Sieve, authentication and TLS policy
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_delivery.py
        executable: python3
      environment:
        PYTHONPATH: /etc/dovecot-test
      changed_when: false

    - name: Verify spam and ham learning on the Rspamd controller
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_learning.py
        executable: python3
      environment:
        PYTHONPATH: /etc/dovecot-test
      changed_when: false
      when: dovecot_spam_learning_enabled | default(false)

    - name: DOVECOT | Verify session continuity, mailbox quota and SMTP vacation replies
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_policy.py verify
        executable: python3
      changed_when: false

    - name: DOVECOT | Exercise PostgreSQL and local-part PAM identities
      ansible.builtin.include_role:
        name: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_PROJECT_DIRECTORY'') }}'
      vars: &dovecot_postgres_pam
        dovecot_sql: '{{ hostvars[inventory_hostname].dovecot_sql | combine({''driver'': ''pgsql'', ''port'': 5432}) }}'
        dovecot_quota_full_tempfail: true
        dovecot_pam_username_format: localpart
        dovecot_pam_service: dovecot
        dovecot_auth_worker_user: ''

    - name: DOVECOT | Verify the alternate SQL driver and PAM identity mapping
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_delivery.py --sql
        executable: python3
      environment:
        PYTHONPATH: /etc/dovecot-test
      changed_when: false

    - name: DOVECOT | Verify diagnostics for main and independent lookup changes
      when: inventory_hostname == ansible_play_hosts_all[0]
      vars: *dovecot_postgres_pam
      block:
        - name: DOVECOT | Validate a candidate with an unknown setting
          vars:
            __dovecot_expected_file: dovecot.conf
            __dovecot_expected_error: 'Unknown setting: no_such_setting'
            dovecot_config: 'no_such_setting = private-fixture-value'
          block: &dovecot_invalid_candidate
            - name: DOVECOT | Apply the invalid candidate
              ansible.builtin.include_role:
                name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
                tasks_from: config

            - name: DOVECOT | Fail if the invalid candidate was installed
              ansible.builtin.fail:
                msg: Invalid configuration was accepted.

          rescue: &dovecot_rejected_candidate
            - name: DOVECOT | Require the affected file and native error with the value redacted
              ansible.builtin.assert:
                that:
                  - __dovecot_expected_file in ansible_failed_result.msg
                  - ansible_failed_result.msg is search('line [0-9]+')
                  - __dovecot_expected_error in ansible_failed_result.msg
                  - "'private-fixture-value' not in ansible_failed_result.msg"
                quiet: true

        - name: DOVECOT | Validate a changed SQL include with the main configuration unchanged
          vars:
            __dovecot_expected_file: sql.conf.ext
            __dovecot_expected_error: Invalid port number
            dovecot_sql: >-
              {{ hostvars[inventory_hostname].dovecot_sql
                 | combine({'driver': 'mysql', 'port': 65536, 'password': 'private-fixture-value'}) }}
          block: *dovecot_invalid_candidate
          rescue: *dovecot_rejected_candidate

    - name: DOVECOT | Verify temporary LMTP and Postfix failure on the same full mailbox
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_policy.py defer
        executable: python3
      changed_when: false

    - name: DOVECOT | Acquire a ticket before the directory outage
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - kinit
          - ad@MAIL.TEST
        stdin: '{{ __dovecot_ad_user_password }}'
      environment:
        KRB5CCNAME: FILE:/tmp/dovecot-test.ccache
      register: __dovecot_kinit
      changed_when: __dovecot_kinit.rc == 0
      failed_when: __dovecot_kinit.rc != 0
      no_log: true

    - name: DOVECOT | Cache the IMAP service ticket before the outage
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - kvno
          - imap/{{ inventory_hostname }}.mail.test
      environment:
        KRB5CCNAME: FILE:/tmp/dovecot-test.ccache
      register: __dovecot_service_ticket
      changed_when: __dovecot_service_ticket.rc == 0
      failed_when: __dovecot_service_ticket.rc != 0

- name: DOVECOT | Introduce an external identity service outage
  hosts: dovecot_dc
  gather_facts: false
  tasks:

    - name: DOVECOT | Require a vacation reply from each Postfix host at the remote SMTP receiver
      become: true
      become_user: root
      ansible.builtin.wait_for:
        path: /run/dovecot-test-smtp/messages
        search_regex: '(?im)^Subject: fixture-away-{{ __dovecot_server | regex_escape }}\r?$'
        timeout: 45
      loop: "{{ groups['dovecot_servers'] }}"
      loop_control:
        loop_var: __dovecot_server

    - name: DOVECOT | Stop the directory and database fixture services
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: '{{ __dovecot_service }}'
        state: stopped
      loop:
        - samba-ad-dc
        - mariadb
        - postgresql
      loop_control:
        loop_var: __dovecot_service
        label: '{{ __dovecot_service }}'

- name: DOVECOT | Verify outage handling and feature removal
  hosts: dovecot_servers
  gather_facts: false
  tasks:

    - name: DOVECOT | Verify outage isolation and rejection of uncertain identity lookups
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_delivery.py --outage
        executable: python3
      environment:
        PYTHONPATH: /etc/dovecot-test
      changed_when: false

- name: DOVECOT | Interrupt one delivery-only transition after writing its configuration
  hosts: dovecot_servers[0]
  gather_facts: false
  vars: &delivery_only
    dovecot_quota_enabled: false
    dovecot_quota_status_enabled: false
    dovecot_mail_ownership: shared
    dovecot_mail_root: /var/vmail-shared
    dovecot_imap_enabled: false
    dovecot_spam_learning_enabled: false
    dovecot_managesieve_enabled: false
    dovecot_postfix_auth_enabled: false
    dovecot_sieve_enabled: false
    dovecot_sieve_before: ''
    dovecot_sasl_users: []
    dovecot_pam_enabled: false
    dovecot_gssapi_enabled: false
    dovecot_sql_enabled: false
    dovecot_ldap_enabled: false
    dovecot_users:
      - name: delivery@example.test
        password_hash: '*'
  tasks:
    - name: DOVECOT | Apply only the configuration phase on the interrupted host
      ansible.builtin.include_role:
        name: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_PROJECT_DIRECTORY'') }}'
        tasks_from: config

    - name: DOVECOT | End the run before service activation
      ansible.builtin.meta: end_host

- name: DOVECOT | Converge and verify the delivery-only configuration
  hosts: dovecot_servers
  gather_facts: false
  vars: *delivery_only
  tasks:
    - name: DOVECOT | Exercise the delivery-only configuration
      ansible.builtin.include_role:
        name: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_PROJECT_DIRECTORY'') }}'

    - name: DOVECOT | Check feature removal and preserved mailbox data
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_delivery.py --mda
        executable: python3
      environment:
        PYTHONPATH: /etc/dovecot-test
      changed_when: false
