---
# role: dovecot
# file: molecule/resources/playbooks/prepare.yml

- name: DOVECOT | Prepare TLS and package metadata
  hosts: all
  gather_facts: true
  tasks:

    - name: DOVECOT | Refresh APT package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: DOVECOT | Refresh DNF package metadata
      become: true
      become_user: root
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

    - name: DOVECOT | Refresh Zypper package metadata
      become: true
      become_user: root
      community.general.zypper_repository:
        repo: '*'
        runrefresh: true
      when: ansible_facts.pkg_mgr == 'zypper'

    - name: DOVECOT | Install certificate fixture tools
      become: true
      become_user: root
      ansible.builtin.package:
        name:
          - python3-cryptography
        state: present

    - name: DOVECOT | Install mail protocol and Kerberos clients
      become: true
      become_user: root
      ansible.builtin.package:
        name:
          - postfix
          - python3-gssapi
        state: present
      when: inventory_hostname in groups['dovecot_servers']

    - name: Install pamtester for independent account and system login checks
      become: true
      become_user: root
      ansible.builtin.package:
        name: pamtester
        state: present
      when: inventory_hostname in groups['dovecot_servers'] and ansible_facts.distribution == 'Debian'

    - name: Prepare the Rspamd controller on the learning host
      ansible.builtin.include_tasks: ../tasks/rspamd.yml
      when: dovecot_spam_learning_enabled | default(false)

    - name: DOVECOT | Create the Postfix socket directory fixture
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/spool/postfix/private
        state: directory
        owner: postfix
        group: root
        mode: '0700'
      when: inventory_hostname in groups['dovecot_servers']

    - name: DOVECOT | Create the certificate fixture directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/dovecot-test
        state: directory
        mode: '0755'

    - name: DOVECOT | Generate the fixture key
      become: true
      become_user: root
      community.crypto.openssl_privatekey:
        path: /etc/dovecot-test/server.key
        type: RSA
        size: 2048
        mode: '0600'

    - name: DOVECOT | Generate the fixture certificate request
      become: true
      become_user: root
      community.crypto.openssl_csr:
        path: /etc/dovecot-test/server.csr
        privatekey_path: /etc/dovecot-test/server.key
        common_name: '{{ inventory_hostname }}.mail.test'
        subject_alt_name:
          - DNS:localhost
          - IP:127.0.0.1
          - DNS:{{ inventory_hostname }}.mail.test
        mode: '0644'

    - name: DOVECOT | Sign the fixture certificate
      become: true
      become_user: root
      community.crypto.x509_certificate:
        path: /etc/dovecot-test/server.pem
        csr_path: /etc/dovecot-test/server.csr
        privatekey_path: /etc/dovecot-test/server.key
        provider: selfsigned
        mode: '0644'

- name: DOVECOT | Prepare a real directory and SQL services
  hosts: dovecot_dc
  gather_facts: true
  module_defaults:
    group/jomrr.samba.all: "{{ __dovecot_directory_admin }}"
  tasks:

    - name: DOVECOT | Prepare the domain controller fixture
      ansible.builtin.import_tasks: ../tasks/domain.yml

    - name: DOVECOT | Prepare PostfixAdmin database fixtures
      ansible.builtin.import_tasks: ../tasks/database.yml

- name: DOVECOT | Prepare externally managed member services
  hosts: dovecot_servers
  gather_facts: true
  tasks:

    - name: DOVECOT | Prepare membership and service credentials
      ansible.builtin.import_tasks: ../tasks/member.yml

    - name: DOVECOT | Prepare the Postfix submission authorization fixture
      ansible.builtin.import_tasks: ../tasks/postfix.yml
