---
# role: dovecot
# file: molecule/resources/playbooks/side_effect.yml


- name: DOVECOT | Grant a newly entitled mailbox in AD
  hosts: dovecot_dc
  gather_facts: false
  module_defaults:
    group/jomrr.samba.all: "{{ __dovecot_directory_admin }}"
  tasks:

    - name: DOVECOT | Add the mailbox account to its entitlement group
      jomrr.samba.samba_group:
        name: MailUsers
        members: [ad, disabled]

- name: DOVECOT | Activate a new file-backed mailbox
  hosts: dovecot_servers
  gather_facts: false
  tasks:
    - name: Prepare the invalid mailbox homes beneath the role-created mail root
      become: true
      become_user: root
      ansible.builtin.file:
        path: "/var/vmail/{{ __dovecot_home.name }}"
        state: directory
        owner: "{{ __dovecot_home.uid | string }}"
        group: "{{ __dovecot_home.gid | string }}"
        mode: "{{ __dovecot_home.mode }}"
      loop:
        - {name: baduid@mail.test, uid: 69999, gid: 70100, mode: '0700'}
        - {name: badgid@mail.test, uid: 70204, gid: 69999, mode: '0700'}
        - {name: drift@mail.test, uid: 70205, gid: 70100, mode: '0750'}
      loop_control:
        loop_var: __dovecot_home
        label: "{{ __dovecot_home.name }}"

    - name: DOVECOT | Open an authenticated IMAP session across the next convergence
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: ../tests/verify_policy.py open
        executable: python3
      changed_when: false

    - name: DOVECOT | Enable the new file account in the test inventory
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /run/dovecot-test-file-account
        content: "maildir@example.test\n"
        mode: '0600'
