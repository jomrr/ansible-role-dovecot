---
# role: dovecot
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
        dovecot_hostname: "mail.example.test"
        dovecot_postmaster_address: "postmaster@example.test"
        dovecot_imap_enabled: true
        dovecot_managesieve_enabled: true
        dovecot_tls_certificate: "/etc/dovecot-test/server.pem"
        dovecot_tls_private_key: "/etc/dovecot-test/server.key"
        dovecot_users:
          - name: "maildir@example.test"
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "maildir"
          - name: "mbox@example.test"
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "mbox"
          - name: "sdbox@example.test"
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "sdbox"
          - name: "mdbox@example.test"
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "mdbox"
          - name: "delivery@example.test"
            password_hash: "*"
        dovecot_sieve_before: |
          require ["fileinto"];
          if header :is "X-Dovecot-Test" "spam" {
            fileinto "Junk";
            stop;
          }
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "side_effect"
    - "converge"
    - "check"
    - "verify"
    - "destroy"
  name: "default"
platforms:
  - name: "dovecot"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
