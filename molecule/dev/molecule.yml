---
# role: dovecot
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/molecule/resources/requirements.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
        __dovecot_ad_admin_password: "Molecule-AD-Adm1n!"
        __dovecot_ad_user_password: "Molecule-AD-Us3r!"
      dovecot_dc:
        __dovecot_directory_admin:
          server: "dc-dovecot.mail.test"
          realm: "MAIL.TEST"
          bind_username: "Administrator"
          bind_password: "{{ __dovecot_ad_admin_password }}"
      dovecot_servers:
        dovecot_hostname: "{{ inventory_hostname }}.mail.test"
        dovecot_postmaster_address: "postmaster@example.test"
        dovecot_quota_enabled: true
        dovecot_quota_storage_size: 10485760
        dovecot_quota_grace: 8192
        dovecot_quota_status_enabled: true
        dovecot_submission_host: "127.0.0.1:10025"
        dovecot_imap_enabled: true
        dovecot_managesieve_enabled: true
        dovecot_tls_certificate: "/etc/dovecot-test/server.pem"
        dovecot_tls_private_key: "/etc/dovecot-test/server.key"
        dovecot_users:
          - name: "maildir@example.test"
            uid: 70001
            gid: 70000
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "maildir"
          - name: "mbox@example.test"
            uid: 70002
            gid: 70000
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "mbox"
          - name: "sdbox@example.test"
            uid: 70003
            gid: 70000
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "sdbox"
          - name: "mdbox@example.test"
            uid: 70004
            gid: 70000
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            mail_format: "mdbox"
          - name: "quota@example.test"
            uid: 70007
            gid: 70000
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
            quota_storage_size: 16384
          - name: "delivery@example.test"
            uid: 70005
            gid: 70000
            password_hash: "*"
          - name: "pamlocal@mail.test"
            uid: 70006
            gid: 70000
            password_hash: "*"
        dovecot_sieve_before: |-
          require ["fileinto", "vacation"];
          if header :is "X-Dovecot-Test" "away" {
            vacation :days 1 :subject "fixture-away-{{ inventory_hostname }}" "Away for the day.";
            stop;
          }
          if header :is "X-Dovecot-Test" "spam" {
            fileinto "Junk";
            stop;
          }
        dovecot_pam_enabled: true
        dovecot_pam_service: "dovecot-test-winbind"
        dovecot_pam_username_filter:
          - "*@mail.test"
        dovecot_auth_worker_user: "doveauth"
        dovecot_gssapi_enabled: true
        dovecot_krb5_keytab: "/etc/dovecot-test/service.keytab"
        dovecot_sql_enabled: true
        dovecot_ldap_enabled: true
        dovecot_sasl_users:
          - name: "sender@mail.test"
            password_hash: "{SHA512-CRYPT}$$6$$dovecotfixture$$nJZZj3C.o5vFWgDGA0iKfaH1Nkh.X7YmBW/XxbdKjqMJFQlqoK68wFo4OjGZu1AE8epNkeV4h/27kwps1UGE.."
        dovecot_sql:
          driver: "mysql"
          host: "dc-dovecot.mail.test"
          port: 3306
          database: "postfixadmin"
          username: "dovecot"
          password: "molecule-database-secret"
          ca_file: "/etc/dovecot-test/directory-ca.pem"
          password_query: "SELECT username AS user, password FROM mailbox WHERE username = '%{user}' AND active = TRUE AND\
            \ password <> '*'"
          user_query: "SELECT username AS user, uid, gid FROM mailbox WHERE username = '%{user}' AND active = TRUE"
          iterate_query: "SELECT username AS user FROM mailbox WHERE active = TRUE AND uid >= 70000 AND gid >= 70000"
        dovecot_ldap:
          uris:
            - "ldaps://dc-dovecot.mail.test"
          bind_dn: "CN=ldap-reader,CN=Users,DC=mail,DC=test"
          bind_password: "Molecule-AD-Us3r!"
          base: "DC=mail,DC=test"
          ca_file: "/etc/dovecot-test/directory-ca.pem"
          user_filter: "(&(objectClass=user)(mail=%{user})(memberOf=CN=MailUsers,CN=Users,DC=mail,DC=test)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))"
          user_fields:
            user: "%{ldap:mail}"
            uid: "%{ldap:uidNumber}"
            gid: "%{ldap:gidNumber}"
          iterate_filter: "(&(objectClass=user)(memberOf=CN=MailUsers,CN=Users,DC=mail,DC=test)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))"
          iterate_user: "%{ldap:mail}"
    host_vars:
      mail-debian:
        dovecot_home_provisioning: "timer"
      mail-leap:
        dovecot_mail_format: "mbox"
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
    cleanup: "../resources/playbooks/cleanup.yml"
  connection_options:
    ansible_user: "molecule"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "side_effect"
    - "converge"
    - "check"
    - "verify"
    - "destroy"
  name: "dev"
platforms:
  - pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "dovecot-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
      - "--tmpfs=/srv/samba:rw,size=256m,mode=0755"
    groups:
      - "dovecot_servers"
    name: "mail-alma"
    hostname: "mail-alma"
    image: "docker.io/jomrr/molecule-almalinux:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "dovecot-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
      - "--tmpfs=/srv/samba:rw,size=256m,mode=0755"
    groups:
      - "dovecot_servers"
    name: "mail-debian"
    hostname: "mail-debian"
    image: "docker.io/jomrr/molecule-debian:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "dovecot-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
      - "--tmpfs=/srv/samba:rw,size=256m,mode=0755"
    groups:
      - "dovecot_servers"
    name: "mail-fedora"
    hostname: "mail-fedora"
    image: "docker.io/jomrr/molecule-fedora:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "dovecot-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
      - "--tmpfs=/srv/samba:rw,size=256m,mode=0755"
    groups:
      - "dovecot_servers"
    name: "mail-leap"
    hostname: "mail-leap"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "dovecot-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
      - "--tmpfs=/srv/samba:rw,size=256m,mode=0755"
    groups:
      - "dovecot_servers"
    name: "mail-suse"
    hostname: "mail-suse"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "dovecot-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
      - "--tmpfs=/srv/samba:rw,size=256m,mode=0755"
    groups:
      - "dovecot_servers"
    name: "mail-ubuntu"
    hostname: "mail-ubuntu"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "dovecot-${MOLECULE_SCENARIO_NAME}"
    extra_opts:
      - "--uidmap=0:0:10000"
      - "--uidmap=60000:10000:40000"
      - "--gidmap=0:0:10000"
      - "--gidmap=60000:10000:40000"
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
    groups:
      - "dovecot_dc"
    name: "dc-dovecot"
    hostname: "dc-dovecot"
    image: "docker.io/jomrr/molecule-debian:latest"
