---
# role: dovecot
# file: handlers/main.yml

- name: DOVECOT | Compile the administrator Sieve script
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [sievec, -c, /etc/dovecot/dovecot.conf, /etc/dovecot/sieve-before.sieve]
  changed_when: true
  listen: compile sieve

- name: DOVECOT | Protect the compiled Sieve script
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/dovecot/sieve-before.svbin
    owner: root
    group: "{{ 'dovecot-sieve' if dovecot_mail_ownership == 'per_user' else dovecot_mail_group }}"
    mode: '0640'
  listen: compile sieve

- name: DOVECOT | Validate the complete configuration before stopping the running service
  become: true
  become_user: root
  ansible.builtin.command:
    cmd: "{{ __dovecot_validate_config | replace('%s', '/etc/dovecot/dovecot.conf') }}"
  changed_when: false
  no_log: true
  listen: restart dovecot

- name: DOVECOT | Restart delivery with validated configuration
  become: true
  become_user: root
  ansible.builtin.service:
    name: dovecot
    state: restarted
  listen: restart dovecot
